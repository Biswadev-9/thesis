# @package _global_
#
# Step 15 (Swin-T arm): train the final model under the fixed protocol, across three seeds.
#
#   python src/train.py -m experiment=step15_final_protocol_swin seed=42,123,7 \
#       loss@model.criterion=<whatever Step 14 selected on the swin cache>
#
# Identical to step15_final_protocol.yaml except:
#   - model:    final_classifier_swin  (classical_dim 768 instead of 1280)
#   - data.tag: swin                   (the Swin-T feature cache, not the baseline's)
#
# The protocol itself is untouched: AdamW, lr 1e-4 (forced by protocol/fixed.yaml),
# weight decay 1e-4, batch size 32, max 30 epochs, cosine annealing, patience 12,
# selection on val/f1_macro. Nothing here may change after Step 16 is run.
#
# Pin the output directory so this arm cannot overwrite the baseline's runs:
#
#   hydra.run.dir=logs/train/runs/step15_final_swin/seed_42

defaults:
  - override /data: bt_mri_features
  - override /model: final_classifier_swin
  - override /callbacks: mri
  - override /trainer: default
  - override /protocol: fixed

tags: ["step15", "final-model", "swin"]

data:
  tag: swin
