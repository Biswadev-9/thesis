# Step 9, Baseline 3: EfficientNet-B0 transfer learning.
# Also the backbone selected for the Step 10 classical branch, so this run doubles as
# evidence for that choice. Frozen except the last three feature blocks.

defaults:
  - /loss@criterion: weighted_ce

_target_: src.models.mri_classification_module.MRIClassificationModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 1e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 30

net:
  _target_: src.models.components.transfer.TransferBackbone
  arch: efficientnet_b0
  num_classes: 4
  weights: DEFAULT
  freeze_backbone: true
  dropout: 0.3

num_classes: 4
class_names: ["Glioma", "Meningioma", "Pituitary", "No-tumor"]

compile: false
