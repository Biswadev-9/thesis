# Step 25: quantum circuit adaptivity ablation.
#
#   python src/analyze.py analysis=step25_quantum_circuit_ablation \
#       analysis.run_root=logs/train/runs/step25_quantum_circuit_ablation \
#       analysis.confirmation_summary=logs/analyze/runs/step06_confirm/step06_confirm_summary.json
#
# Answers one question: does adaptively weighting multiple quantum circuit architectures
# per image improve performance over a single fixed quantum circuit?
#
# THE LADDER (all four are the existing Step 12 class - no new architecture):
#
#   FIXED_BASIC       circuit_names=[fixed]    2 BasicEntangler layers      8 q-params
#   FIXED_DEEP        circuit_names=[deep]     4 BasicEntangler layers     16 q-params
#   FIXED_STRONG      circuit_names=[strong]   2 StronglyEntangling layers 24 q-params
#   ADAPTIVE_QUANTUM  circuit_names=null       all five, softmax-mixed    104 q-params
#
# With one circuit the softmax is identically 1.0, so the mixture is mathematically inert
# and the same class expresses both the treatment and its controls.
#
# THREE PRIMARY COMPARISONS, one Holm-corrected family: the mixture against each fixed
# circuit. Unlike Step 24's family of one, the correction genuinely bites here. The three
# fixed-versus-fixed comparisons are descriptive - whether depth or entanglement alone
# explains a difference is a different question, and promoting them would double the family.
#
# VALIDATION ONLY. This is an architecture question, like Steps 6, 8, 13 and 14, so the
# internal test set stays sealed for Step 16. `split` is asserted to be `val`.
#
# CAPACITY IS NOT MATCHED. The adaptive condition carries five circuits' weights - at most
# 356 more parameters, 0.49% - and the gap runs in its favour. Counts are measured by
# building the models, never tabulated.
#
# SCOPE. The Step 11 spatial gate lives inside the Step 12 branch and is the large majority
# of the parameters. It is identical across all four conditions, so the comparison is valid,
# but what it licenses is a claim about circuit-mixture adaptivity ONLY.
#
# Step 25 does not alter Steps 21-24 and does not re-run them.

_target_: src.analysis.quantum_circuit_ablation_study.QuantumCircuitAblationStudy

name: step25_quantum_circuit_ablation

_recursive_: false

# Where the Step 25 training runs live: <run_root>/<condition>/seed_<n>.
run_root: logs/train/runs/step25_quantum_circuit_ablation

# THE PREPROCESSING RECIPE IS NOT CHOSEN HERE. Step 25 follows the same policy as the
# Step 12 experiment it ablates: Step 6's authoritative real-backbone confirmation.
#
#   analysis.confirmation_summary=logs/analyze/runs/step06_confirm/step06_confirm_summary.json
#
# With no confirmation and no explicit override this stage REFUSES TO RUN. There is no
# fallback to the reduced-scale proxy ranking.
confirmation_summary: null

# Explicit development override, mirroring the pipeline's `--recipe` flag. Takes precedence
# over the confirmation and is recorded in the output as the recipe's source. Use it for
# code and config testing; the final study must use the confirmed recipe.
recipe: null

# Step 15: "Run at least three seeds for the final model and major baselines."
seeds: [42, 123, 7]

# Validation. Anything else is refused - the test set is Step 16's, once.
split: val

alpha: 0.05

confidence_level: 0.95

# Matches Steps 20, 23 and 24 and src/utils/statistics.py's default.
n_resamples: 2000

# Every resampling procedure is seeded from here, so the report is reproducible.
random_seed: 42

# Which training seed the paired tests read. Fixed rather than best-of-three, matching how
# every other stage in the study picks its checkpoint.
paired_seed: 42

n_calibration_bins: 10

# Report a missing seed and carry on. Set true when the ladder is expected to be complete.
strict: false

accelerator: auto
