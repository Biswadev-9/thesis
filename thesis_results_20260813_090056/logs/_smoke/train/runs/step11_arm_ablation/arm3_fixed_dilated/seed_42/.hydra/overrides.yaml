- experiment=step11_arm_ablation
- model.net.arm=arm3_fixed_dilated
- seed=42
- trainer=gpu
- data.recipe=null
- data.num_workers=2
- data.pin_memory=true
- ++trainer.max_epochs=1
- ++trainer.limit_train_batches=3
