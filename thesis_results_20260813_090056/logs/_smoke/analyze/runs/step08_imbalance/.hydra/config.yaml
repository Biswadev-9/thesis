task_name: analyze
tags:
- analysis
seed: 42
data:
  _target_: src.data.bt_mri_datamodule.BTMRIDataModule
  data_dir: ${paths.data_dir}
  raw_subdir: raw/bt_mri
  split_subpath: splits/dataset_split.csv
  recipe: null
  image_size: 224
  normalize: imagenet
  crop_background: false
  augment: true
  use_weighted_sampler: true
  batch_size: 32
  num_workers: 2
  pin_memory: true
  seed: 42
  val_frac: 0.15
  test_frac: 0.15
model:
  criterion:
    _target_: src.models.components.losses.CrossEntropyLoss
    use_class_weights: true
    label_smoothing: 0.0
  _target_: src.models.mri_classification_module.MRIClassificationModule
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 30
  net:
    _target_: src.models.components.multiscale.MultiscaleClassifier.from_arm
    arm: arm6_spatial_gate
    num_classes: 4
    channels: 32
    dropout: 0.3
  num_classes: 4
  class_names:
  - Glioma
  - Meningioma
  - Pituitary
  - No-tumor
  compile: false
analysis:
  _target_: src.analysis.imbalance_study.ImbalanceStudy
  name: step08_imbalance
  strategies: null
  recipe: conventional
  epochs: 1
  per_class_train: 24
  per_class_val: 12
  image_size: 128
  lr: 0.001
  focal_gamma: 2.0
  compare_legacy_focal: true
  seed: ${seed}
  accelerator: auto
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
